function verifierLettre() {
    if (!(document.getElementById("mot").value === "")) {
    if (!(document.getElementById("Erreur").textContent.includes(' ' + document.getElementById("mot").value.toLowerCase()))) {
    let lettre = document.getElementById("mot").value;
    lettre = lettre.toLowerCase();
    document.getElementById("mot").value = "";
    let mot_a_trouver=document.getElementById("resultat").textContent;
    
    if (lettre.length > 1) {
        if (lettre === mot_a_trouver) {
            document.getElementById("mot_a_trouver").innerHTML = mot_a_trouver;
           setTimeout(() => alert("Vous avez gagne !"), 100);
            
        } else {
            alert("Mauvais mot !");
            document.getElementById("nb_erreurs").innerHTML = parseInt(document.getElementById("nb_erreurs").textContent) + 1;
            document.getElementById("Erreur").innerHTML += lettre + ", ";
            if (document.getElementById("langue").value === "fr" && (document.getElementById("niveau1").checked || document.getElementById("niveau2").checked)) {
                if (parseInt(document.getElementById("nb_erreurs").textContent) >= 6) {
                    defaite();
                }
            } else if ((document.getElementById("langue").value === "en") || (document.getElementById("niveau3").checked)) {
                if (parseInt(document.getElementById("nb_erreurs").textContent) >= 10) {
                    defaite();
                }
            } else if (document.getElementById("langue").value === "de") {
                if (parseInt(document.getElementById("nb_erreurs").textContent) >= 15) {
                    defaite();
                }
            }
        }
    } else if (mot_a_trouver.includes(lettre)) {
        let affichage = document.getElementById("mot_a_trouver").textContent;
        for (let i = 0; i < mot_a_trouver.length; i++) {
            if (mot_a_trouver[i] === lettre) {
                affichage = affichage.substring(0, i * 2) + lettre + affichage.substring(i * 2 + 1);
            }
        }   
        document.getElementById("mot_a_trouver").innerHTML = affichage;
    } else {
        document.getElementById("Erreur").innerHTML += lettre + ", ";
        document.getElementById("nb_erreurs").innerHTML = parseInt(document.getElementById("nb_erreurs").textContent) + 1;
        if (document.getElementById("langue").value === "fr" && (document.getElementById("niveau1").checked || document.getElementById("niveau2").checked)) {
                if (parseInt(document.getElementById("nb_erreurs").textContent) >= 6) {
                    defaite();
                }
                else if (document.getElementById("langue").value === "fr" && document.getElementById("niveau3").checked) {
                    if (parseInt(document.getElementById("nb_erreurs").textContent) >= 8) {
                        defaite();
                    }
                }
            } else if (document.getElementById("langue").value === "en")  {
                if (parseInt(document.getElementById("nb_erreurs").textContent) >= 10) {
                    defaite();
                }
            } else if (document.getElementById("langue").value === "de") {
                if (parseInt(document.getElementById("nb_erreurs").textContent) >= 15) {
                    defaite();
                }
            }
                    
                }
            }
            else {
                alert("Vous avez déjà essayé cette lettre !");
                document.getElementById("mot").value = "";
            }
}
}

function defaite() {
    let mot_a_trouver=document.getElementById("resultat").textContent;

                    document.getElementById("mot_a_trouver").innerHTML = mot_a_trouver;
                let count = 0;
                const interval = setInterval(() => {
                    document.getElementById("mot_a_trouver").style.visibility = count % 2 === 0 ? "hidden" : "visible";
                    count++;
                    if (count >= 10) clearInterval(interval);
                }, 300);
                setTimeout(() => alert("Vous avez perdu ! Le mot etait : " + mot_a_trouver), 3000);
}

const partiesPendu = ["tete", "corps", "bras-g", "bras-d", "jambe-g", "jambe-d"];

function afficherPendu() {
    let nbErreurs = parseInt(document.getElementById("nb_erreurs").textContent);
    let langue = document.getElementById("langue").value;
    
    // Limite d'erreurs selon la langue
    let limiteErreurs = langue === "fr" ? 8 : (langue === "en" ? 10 : 15);
    
    // Afficher les parties du pendu proportionnellement
    let ratio = nbErreurs / limiteErreurs;
    let partiesToShow = Math.floor(ratio * partiesPendu.length);
    
    for (let i = 0; i < partiesToShow; i++) {
        document.getElementById(partiesPendu[i]).style.display = "block";
    }
    
    for (let i = partiesToShow; i < partiesPendu.length; i++) {
        document.getElementById(partiesPendu[i]).style.display = "none";
    }
}

// Appeler cette fonction apres chaque verification
const verifierLettreOriginal = verifierLettre;
